<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign In - GENAI EDUCANTION ENGINE</title>
<link rel="icon" type="image/png" href="img/logo.png"/>
<link rel="stylesheet" href="css/main.css"/>
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-card glass">
    <div class="auth-header">
      <img src="img/logo.png" alt="Logo" class="auth-logo">
      <h1>Welcome Back</h1>
      <p>Sign in to continue your learning journey</p>
    </div>
    
    <div id="error-msg" class="alert alert-error" style="display:none;margin-bottom:1rem"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div style="position:relative">
          <span class="material-symbols-outlined" style="position:absolute;left:.75rem;top:50%;transform:translateY(-50%);font-size:1.1rem;color:var(--text-light)">mail</span>
          <input type="email" id="email" class="input-field" style="padding-left:2.5rem" placeholder="name@company.com" required>
        </div>
      </div>
      <div class="form-group">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
          <label for="password" style="margin-bottom:0">Password</label>
          <a href="#" style="font-size:.75rem;color:var(--primary);font-weight:600;text-decoration:none">Forgot?</a>
        </div>
        <div style="position:relative">
          <span class="material-symbols-outlined" style="position:absolute;left:.75rem;top:50%;transform:translateY(-50%);font-size:1.1rem;color:var(--text-light)">lock</span>
          <input type="password" id="password" class="input-field" style="padding-left:2.5rem" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1rem" id="login-btn">Sign In</button>
    </form>

    <div style="margin-top:2rem">
      <div class="divider-text"><span>OR CONTINUE WITH</span></div>
      <div style="display:grid;grid-template-columns:1fr;gap:.75rem;margin-top:1.5rem">
         <button class="btn btn-secondary" style="gap:.5rem"><img src="https://www.google.com/favicon.ico" width="16" height="16"/> Google</button>
      </div>
    </div>
    
    <div style="margin-top:1.5rem">
      <div style="background:var(--primary-bg);border:1px solid rgba(71,70,229,0.15);border-radius:var(--radius-md);padding:0.9rem 1rem;font-size:0.8rem;color:var(--text-muted);text-align:center">
        🎯 Demo: <strong style="color:var(--primary)">alex@demo.com</strong> / <strong style="color:var(--primary)">password123</strong>
      </div>
    </div>
    <p style="text-align:center;margin-top:1.5rem;font-size:0.875rem;color:var(--text-muted)">
      Don't have an account? <a href="signup.html" style="color:var(--primary);font-weight:600;text-decoration:none">Sign Up Free</a>
    </p>
  </div>
</div>
<script src="js/theme.js"></script><script src="js/api.js?v=2"></script>
<script>
  // Redirect if already logged in
  Auth.me().then(u => { if(u) window.location.href = '/dashboard.html'; });

  const params = new URLSearchParams(window.location.search);
  if (params.get('email')) {
    document.getElementById('email').value = params.get('email');
  }

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const errEl = document.getElementById('error-msg');
    
    const currentEmail = document.getElementById('email').value.trim();
    if (!currentEmail || !document.getElementById('password').value) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in...';
    errEl.style.display = 'none';

    try {
      await API.post('/api/auth/login', {
        email: currentEmail,
        password: document.getElementById('password').value
      });
      
      // Success
      window.location.href = '/dashboard.html';
    } catch(err) {
      btn.disabled = false;
      btn.textContent = 'Sign In';
      errEl.style.display = 'block';

      if (err.requires_verification) {
        errEl.textContent = 'Email not verified. Redirecting...';
        setTimeout(() => {
          window.location.href = `/verify-email.html?email=${encodeURIComponent(currentEmail)}`;
        }, 1500);
      } else if (err.status === 401) {
        errEl.textContent = 'Invalid email or password. Please try again.';
      } else {
        errEl.textContent = err.message || 'Login failed. Please try again later.';
      }
    }
  });
</script>
</body>
</html>
