<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign Up - GENAI EDUCANTION ENGINE</title>
<link rel="stylesheet" href="css/main.css"/>
<style>
  .auth-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
  .auth-orb{position:absolute;border-radius:50%;filter:blur(100px)}
  .auth-orb-1{width:500px;height:500px;background:rgba(46,91,255,0.15);top:-10%;right:-10%}
  .auth-orb-2{width:400px;height:400px;background:rgba(87,27,193,0.12);bottom:-5%;left:-5%}
  .error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:var(--radius-md);padding:.75rem 1rem;font-size:.85rem;color:#fca5a5;margin-bottom:1rem;display:none}
  .strength-bar{height:4px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:.4rem;overflow:hidden}
  .strength-fill{height:100%;border-radius:99px;transition:width .3s,background .3s}
</style>
</head>
<body>
<div class="auth-bg"><div class="auth-orb auth-orb-1"></div><div class="auth-orb auth-orb-2"></div></div>
<div class="auth-page">
  <div class="auth-card fade-in-up">
    <div style="display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:2rem">
      <img src="img/logo.png" alt="Logo" style="width:56px;height:56px;object-fit:contain">
      <div style="text-align:left">
        <a href="/" style="text-decoration:none"><span class="text-gradient-blue" style="font-size:1.75rem;font-weight:900">GENAI EDUCANTION ENGINE</span></a>
        <p style="color:var(--on-surface-variant);font-size:.875rem;margin-top:.25rem">Create your free account and start learning today.</p>
      </div>
    </div>
    <div class="card glass" style="padding:2rem">
      <div id="error-msg" class="error-msg"></div>
      <form id="signup-form">
        <div style="margin-bottom:1.1rem">
          <label class="input-label">Full Name</label>
          <input id="name" type="text" class="input-field" placeholder="Alex Rivera" required/>
        </div>
        <div style="margin-bottom:1.1rem">
          <label class="input-label">Email Address</label>
          <input id="email" type="email" class="input-field" placeholder="you@example.com" required/>
        </div>
        <div style="margin-bottom:1.75rem">
          <label class="input-label">Password</label>
          <input id="password" type="password" class="input-field" placeholder="Min 6 characters" required/>
          <div class="strength-bar"><div id="strength-fill" class="strength-fill" style="width:0"></div></div>
          <p id="strength-label" style="font-size:.7rem;color:var(--on-surface-variant);margin-top:.25rem"></p>
        </div>
        <button id="signup-btn" type="submit" class="btn btn-primary btn-full btn-lg">Create Free Account</button>
      </form>
        <div id="otp-section" style="display:none;">
          <h3 style="margin-bottom:1rem;text-align:center;">Verify Your Email</h3>
          <p style="font-size:0.875rem;color:var(--on-surface-variant);text-align:center;margin-bottom:1.5rem">We sent a 6-digit code to <span id="otp-email-display" style="font-weight:700;color:var(--text)"></span>.</p>
          <div style="margin-bottom:1.5rem">
            <input id="otp-code" type="text" class="input-field" placeholder="Enter 6-digit code" style="text-align:center;letter-spacing:0.5rem;font-size:1.25rem;font-weight:700" maxlength="6"/>
          </div>
          <button id="verify-btn" type="button" class="btn btn-primary btn-full btn-lg">Verify Email</button>
          <div style="text-align:center;margin-top:1rem">
            <button id="resend-btn" type="button" style="background:none;border:none;color:#60a5fa;cursor:pointer;font-size:0.875rem">Resend Code</button>
          </div>
        </div>

      <p style="font-size:.75rem;color:var(--on-surface-variant);text-align:center;margin-top:1rem">By signing up you agree to our <a href="#" style="color:#60a5fa">Terms</a> and <a href="#" style="color:#60a5fa">Privacy Policy</a>.</p>
    </div>
    <p style="text-align:center;margin-top:1.5rem;font-size:.875rem;color:var(--on-surface-variant)">
      Already have an account? <a href="login.html" style="color:#60a5fa;font-weight:600;text-decoration:none">Sign In</a>
    </p>
  </div>
</div>
<script src="js/theme.js"></script><script src="js/api.js"></script>
<script>
  Auth.me().then(u=>{if(u)window.location.href='/dashboard.html'});
  
  let currentEmail = "";

  // Check for verification redirect
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('verify') === '1' && urlParams.get('email')) {
    currentEmail = urlParams.get('email');
    document.getElementById('signup-form').style.display = 'none';
    document.getElementById('otp-section').style.display = 'block';
    document.getElementById('otp-email-display').textContent = currentEmail;
  }

  document.getElementById('password').addEventListener('input',function(){
    const v=this.value,len=v.length;
    const fill=document.getElementById('strength-fill'),label=document.getElementById('strength-label');
    if(len===0){fill.style.width='0';label.textContent='';return}
    const score=len<6?1:len<10?2:(/[A-Z]/.test(v)&&/[0-9]/.test(v))?4:3;
    const map={1:{w:'25%',c:'#ef4444',t:'Weak'},2:{w:'50%',c:'#f59e0b',t:'Fair'},3:{w:'75%',c:'#3b82f6',t:'Good'},4:{w:'100%',c:'#10b981',t:'Strong'}};
    fill.style.width=map[score].w;fill.style.background=map[score].c;label.textContent=map[score].t;
  });

  document.getElementById('signup-form').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=document.getElementById('signup-btn'),errEl=document.getElementById('error-msg');
    btn.disabled=true;btn.textContent='Creating account...';errEl.style.display='none';
    currentEmail = document.getElementById('email').value.trim();
    try{
      const res = await API.post('/api/auth/signup',{
        name:document.getElementById('name').value,
        email:currentEmail,
        password:document.getElementById('password').value
      });
      
      if (res.requires_verification) {
        document.getElementById('signup-form').style.display = 'none';
        document.getElementById('otp-section').style.display = 'block';
        document.getElementById('otp-email-display').textContent = currentEmail;
        showToast("Verification code sent to your email.", "info");
      } else {
        window.location.href='/dashboard.html';
      }
    }catch(err){
      errEl.textContent=err.message||'Signup failed.';errEl.style.display='block';
      btn.disabled=false;btn.textContent='Create Free Account';
    }
  });

  document.getElementById('verify-btn').addEventListener('click', async () => {
    const btn = document.getElementById('verify-btn');
    const otp = document.getElementById('otp-code').value.trim();
    const errEl = document.getElementById('error-msg');
    if (!otp) return;

    btn.disabled = true; btn.textContent = 'Verifying...'; errEl.style.display = 'none';
    try {
      await API.post('/api/auth/verify-otp', { email: currentEmail, otp: otp });
      showToast("Successful verification done!", "success");
      setTimeout(() => { window.location.href = '/dashboard.html'; }, 400);
    } catch(err) {
      errEl.textContent = err.message || 'Verification failed.'; errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Verify Email';
    }
  });

  document.getElementById('resend-btn').addEventListener('click', async () => {
    const btn = document.getElementById('resend-btn');
    btn.disabled = true; btn.textContent = 'Sending...';
    try {
      await API.post('/api/auth/resend-otp', { email: currentEmail });
      showToast("A new code has been sent.", "success");
      setTimeout(() => { btn.disabled = false; btn.textContent = 'Resend Code'; }, 5000);
    } catch(err) {
      showToast(err.message || 'Failed to resend code.', "error");
      btn.disabled = false; btn.textContent = 'Resend Code';
    }
  });
</script>
</body>
</html>
