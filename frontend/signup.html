<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Join Now - GENAI EDUCANTION ENGINE</title>
<link rel="icon" type="image/png" href="img/logo.png"/>
<link rel="stylesheet" href="css/main.css"/>
<style>
  .strength-bar{height:4px;width:100%;background:var(--surface-low);border-radius:2px;margin-top:.5rem;overflow:hidden}
  .strength-fill{height:100%;width:0;transition:all .3s}
</style>
</head>
<body class="auth-page">
  <div class="auth-card glass fade-in-up">
    <div class="auth-header">
      <img src="img/logo.png" alt="Logo" class="auth-logo">
      <h1>Create Account</h1>
      <p>Start your AI-powered learning journey today</p>
    </div>
    <div id="error-msg" class="alert alert-error" style="display:none;margin-bottom:1rem"></div>
    <form id="signup-form">
      <div class="form-group"><label for="name">Full Name</label><input type="text" id="name" class="input-field" placeholder="John Doe" required></div>
      <div class="form-group"><label for="email">Email Address</label><input type="email" id="email" class="input-field" placeholder="john@example.com" required></div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="input-field" placeholder="At least 6 characters" required minlength="6">
        <div class="strength-bar"><div id="strength-fill" class="strength-fill"></div></div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1rem" id="signup-btn">Create Free Account</button>
      <div style="margin-top:1.5rem">
        <div class="divider-text"><span>OR SIGN UP WITH</span></div>
        <div style="display:grid;grid-template-columns:1fr;gap:.75rem;margin-top:1.5rem">
          <button type="button" class="btn btn-secondary" style="gap:.5rem"><img src="https://www.google.com/favicon.ico" width="16" height="16"/> Google</button>
        </div>
      </div>
    </form>
    <p style="font-size:.75rem;color:var(--text-muted);text-align:center;margin-top:1rem">By signing up you agree to our <a href="#" style="color:var(--primary)">Terms</a> and <a href="#" style="color:var(--primary)">Privacy Policy</a>.</p>
    <p style="text-align:center;margin-top:1.5rem;font-size:.875rem;color:var(--text-muted)">
      Already have an account? <a href="login.html" style="color:var(--primary);font-weight:600;text-decoration:none">Sign In</a>
    </p>
  </div>
<script src="js/theme.js"></script><script src="js/api.js?v=2"></script>
<script>
  Auth.me().then(u=>{if(u)window.location.href='/dashboard.html'});

  document.getElementById('password').addEventListener('input', e=>{
    const p = e.target.value;
    const f = document.getElementById('strength-fill');
    let s = 0;
    if(p.length > 5) s = 25;
    if(/[A-Z]/.test(p)) s += 25;
    if(/[0-9]/.test(p)) s += 25;
    if(/[^A-Za-z0-9]/.test(p)) s += 25;
    f.style.width = s+'%';
    f.style.background = s<50?'#ef4444':s<75?'#f59e0b':'#10b981';
  });

  document.getElementById('signup-form').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=document.getElementById('signup-btn'),errEl=document.getElementById('error-msg');
    const currentEmail = document.getElementById('email').value.trim();
    
    btn.disabled=true;btn.textContent='Creating account...';errEl.style.display='none';

    try {
      const res = await API.post('/api/auth/signup',{
        name:document.getElementById('name').value,
        email:currentEmail,
        password:document.getElementById('password').value
      });

      if (res.requires_verification) {
        errEl.textContent = 'Account created! Redirecting to verification...';
        errEl.style.color = '#10b981';
        errEl.style.display = 'block';
        setTimeout(() => {
          window.location.href = `/verify-email.html?email=${encodeURIComponent(currentEmail)}`;
        }, 1500);
      } else {
        window.location.href='/dashboard.html';
      }
    } catch(err) {
      btn.disabled = false;
      btn.textContent = 'Create Free Account';
      errEl.textContent = err.message || 'Signup failed.';
      errEl.style.color = '#ef4444';
      errEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
